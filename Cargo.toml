cargo-features = ["panic-immediate-abort", "profile-rustflags"]
[package]
name = "lunacy"
version = "0.1.0"
edition = "2024"

[features]
default = ["counters", "jit", "magic"]
skip_rc = []
skip_vec = []
counters = []
graph = []
immediate_jit = []
# Native JIT (the dynasm `jit` module): compiles the specialized blocks LBBV
# (the `generator` specializer, which runs every closure) produces.
jit = []
# Differential-check every window op the interpreter runs against its
# copy&patched stencil (see src/window.rs; ops the copier rejects are skipped).
check_windows = []
unreachable = []
gas = []
magic = [] # Magic JIT intrinsics
perf = [] # Create perf JIT map file
tracing = [] # Write a Perfetto trace (Fuchsia trace format) of the run to lunacy.fxt
alloc_stats = ["mimalloc/extended", "dep:libmimalloc-sys"] # bench prints mimalloc's statistics
window_dump = ["jit"] # Dump the JIT's window allocation to window_dump.txt
align_loops = ["jit"] # Loop headers' JIT code starts LOOP_ALIGN-aligned
align_selects = ["jit"] # A branch on `select` never crosses a cache line
jit_disasm = ["jit", "yaxpeax-x86/fmt", "dep:rustc-demangle"] # Disassemble the JIT's code, annotated, to jit_disasm.txt when it's dropped
no_dynamic_guards = [] # GuardDynamic yields fail statically (Note [Dynamic guards])
gc_sanitize = []
gc_stress = []
gc_test = []
unsafe = ["jit", "skip_vec", "unreachable"]
sonic = ["unsafe", "skip_rc"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bitfield = "0.17.0"
log = { version = "0.4.22", features = ["release_max_level_off"] }
nom = "7.1.3"
rustc-hash = "2.0.0"
mimalloc = "0.1"
libmimalloc-sys = { version = "0.1", optional = true, features = ["extended"] }
env_logger = "0.11.10"
internment = { version = "0.8.6", features = ["arena"] }
typewit = "1.9.0"
qcell = "0.5.4"
graphviz-rust = { version = "0.4.0" }
indexmap = "2.14.0"
dynasm = "5.0.0"
dynasmrt = { version = "5.0.0", path = "./dynasm-rs/runtime" }
memmap2 = { version = "0.9.10", path = "./memmap2-rs" }
smallvec = "1.15.1"
rsprocmaps = "0.3.2"
goblin = "0.9"
rustc-demangle = { version = "0.1", optional = true }
yaxpeax-x86 = { version = "2.2.0", default-features = false, features = ["std"] }
yaxpeax-arch = { version = "0.3.2", default-features = false, features = ["std"] }

[dev-dependencies]
regex = "1.11.1"

[target.sandbox]

[target.jit]
[target.jit.dependencies]

# Demangles the Rust symbols in its input (`just stencil-sizes`).
[[bin]]
name = "demangle"
required-features = ["jit_disasm"]

[profile.release]
codegen-units = 1
panic = "abort"
lto = "fat"
strip = false
debug = true
# For this machine's instruction set (SSE4.1's `roundsd` for `f64::trunc`, not a
# libm call, and so on): binaries are for benchmarking here, not distribution.
rustflags = ["-C", "force-frame-pointers=yes", "-C", "target-cpu=native"]

# `just test-stencils`: stencils compiled as in release (every package optimized,
# so a stencil inlines the code it calls as release does; no debug assertions or
# overflow checks, for release's target CPU), without release's LTO so that it
# builds quickly.
[profile.stencils]
inherits = "dev"
opt-level = 2
debug-assertions = false
overflow-checks = false
rustflags = ["-C", "target-cpu=native"]

[profile.unsafe]
inherits = "release"
panic = "immediate-abort"
rustflags = ["-C", "target-cpu=native"]

# `just flamegraph`: the unsafe build with frame pointers, so perf unwinds
# through the JIT's code (whose stencils then keep them too).
[profile.flamegraph]
inherits = "unsafe"
rustflags = ["-C", "force-frame-pointers=yes", "-C", "target-cpu=native"]
